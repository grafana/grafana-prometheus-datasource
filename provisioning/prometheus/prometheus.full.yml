global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/alerts.yml
  - /etc/prometheus/rules/recording.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: fake-prometheus-data
    static_configs:
      - targets: ['fake-prometheus-data:9091']

  - job_name: prometheus-random-data
    static_configs:
      - targets: ['prometheus-random-data:8080']

  - job_name: prometheus-high-cardinality
    static_configs:
      - targets: ['prometheus-high-cardinality:9111']

  - job_name: prometheus-utf8
    static_configs:
      - targets: ['prometheus-utf8:9112']
