multitenancy_enabled: false
target: all
server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir
blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb
ingester:
  ring:
    replication_factor: 1
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
store_gateway:
  sharding_ring:
    replication_factor: 1
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
compactor:
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules
limits:
  native_histograms_ingestion_enabled: true
