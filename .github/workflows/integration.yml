name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start backends
        run: docker compose -f tests/integration/docker-compose.yaml up -d --quiet-pull

      - name: Run integration tests
        run: go test -tags integration -count=1 -v ./tests/integration/...

      - name: Backend logs
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yaml logs
