name: Build @grafana/prometheus canary

# Builds and packs a canary tarball for a labelled pull request, with no
# credentials of any kind. release-npm.yml picks the artifact up through
# `workflow_run` and publishes it. Keeping the build here means the job that
# holds npm's OIDC token never checks out, installs, builds or executes pull
# request code.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-canary:
    # Same-repository pull requests only, and only while `npm-canary` is applied.
    # On label events the added label must be `npm-canary` itself, so applying an
    # unrelated label to an already-labelled pull request does not rebuild and ask
    # a maintainer to approve the deployment again.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'npm-canary') &&
      (github.event.action != 'labeled' || github.event.label.name == 'npm-canary')
    name: Build @grafana/prometheus canary
    runs-on: github-hosted-ubuntu-x64-small
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Plan canary version
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          plan_file="$RUNNER_TEMP/npm-canary-plan.json"
          node scripts/plan-npm-canary.js \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" > "$plan_file"

          publish=$(jq -er 'if .publish == true then "true" elif .publish == false then "false" else error("invalid publish value: \(.publish)") end' "$plan_file")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

          if [[ "$publish" == "true" ]]; then
            version=$(jq -er '.version' "$plan_file")
            echo "version=$version" >> "$GITHUB_OUTPUT"
            {
              echo "## Canary artifact planned"
              printf 'Packing `@grafana/prometheus@%s`. No publish credentials are available to this workflow.\n' \
                "$version"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Canary artifact skipped"
              jq -r '.reason' "$plan_file"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build library
        if: steps.plan.outputs.publish == 'true'
        run: npm run build --workspace=@grafana/prometheus

      - name: Set ephemeral canary version
        if: steps.plan.outputs.publish == 'true'
        working-directory: packages/grafana-prometheus
        env:
          CANARY_VERSION: ${{ steps.plan.outputs.version }}
        run: npm pkg set "version=${CANARY_VERSION}"

      - name: Pack canary artifact
        if: steps.plan.outputs.publish == 'true'
        env:
          CANARY_VERSION: ${{ steps.plan.outputs.version }}
          ARTIFACT_DIR: ${{ runner.temp }}/npm-canary-artifact
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          npm pack packages/grafana-prometheus \
            --ignore-scripts \
            --pack-destination "$ARTIFACT_DIR" >/dev/null
          test -f "$ARTIFACT_DIR/grafana-prometheus-${CANARY_VERSION}.tgz"

      - name: Upload canary artifact
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The name binds the artifact to this exact run, so the publish workflow
          # can only ever download the tarball built by the run that triggered it.
          name: npm-canary-${{ github.run_id }}-${{ github.run_attempt }}
          # upload-artifact roots the archive at this directory, so the tarball
          # sits at the artifact root — verify-npm-canary-tarball.sh depends on
          # that layout.
          path: ${{ runner.temp }}/npm-canary-artifact
          if-no-files-found: error
          retention-days: 7
