name: Plugins - CI
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v11.1.0
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      run-playwright: true
      disable-gcs-upload: true

  publish-and-deploy:
    # Disabled: this job publishes to the dev Plugin Catalog and can trigger an
    # Argo rollout to Grafana Cloud. Re-enable by restoring the `main` ref condition.
    if: false
    uses: grafana/data-sources-ci-workflows/.github/workflows/cd-dev.yml@main
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    with:
      go-version: "1.26.7"
      golangci-lint-version: "2.11.0"
